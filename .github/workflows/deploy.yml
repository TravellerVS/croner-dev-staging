name: Deploy Croner Staging to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify staging artifact
        run: |
          test -f index.html
          test -f CNAME
          grep -qx 'staging.croner.dev' CNAME
          test ! -f sitemap.xml
          grep -q 'noindex, nofollow' index.html
          grep -q 'Disallow: /' robots.txt
          grep -q 'src="/assets/' index.html
          grep -q 'href="/assets/' index.html
          ! grep -q '/croner-dev-staging/assets/' index.html
          grep -Rqs 'https://api-staging.croner.dev' assets
          ! grep -Rqs 'https://vander-spring-cron-api-staging.onrender.com' assets

      - name: Prepare static artifact
        run: |
          mkdir -p _site
          rsync -av --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude '_site/' \
            ./ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
